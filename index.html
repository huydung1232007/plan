<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner V13 - Online Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* CSS GIỮ NGUYÊN TỪ V12, THÊM PHẦN LOGIN */
        :root { --primary:#6c5ce7; --secondary:#a29bfe; --success:#00cec9; --danger:#ff7675; --bg-body:#f0f3f8; --card-bg:#ffffff; --text-main:#2d3436; --text-light:#636e72; --input-bg:#f1f2f6; --ring-bg:#dfe6e9; --shadow:0 10px 30px rgba(0,0,0,0.08); }
        body.dark-mode { --bg-body:#1e1e2e; --card-bg:#2b2b40; --text-main:#ecf0f1; --text-light:#b2bec3; --input-bg:#34344a; --ring-bg:#4b4b60; --shadow:0 10px 30px rgba(0,0,0,0.3); }
        * { box-sizing:border-box; transition:all 0.25s ease; }
        body { font-family:'Quicksand', sans-serif; background:var(--bg-body); color:var(--text-main); margin:0; padding:20px; min-height:100vh; }
        
        /* LOGIN SCREEN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-body); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); max-width: 400px; width: 90%; }
        .google-btn { background: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 50px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 20px auto; transition: transform 0.2s; }
        .google-btn:hover { transform: scale(1.05); }

        /* APP CONTAINER (Hidden by default) */
        #app-content { display: none; }
        .app-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 340px 1fr; gap: 25px; }
        
        /* ... (GIỮ NGUYÊN CSS CŨ CỦA V12) ... */
        /* Copy CSS từ V12 dán vào đây hoặc dùng lại CSS cũ */
        /* Để tiết kiệm không gian hiển thị, mình viết gọn lại các class chính */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card-box { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: var(--shadow); }
        .level-badge { background: linear-gradient(45deg, #fd79a8, #e84393); color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; margin: 0 auto 10px; }
        .xp-bar-container { background: rgba(0,0,0,0.1); height: 8px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .xp-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.5s; }
        .deadline-card h3 { margin: 0 0 15px 0; font-size: 16px; color: var(--danger); display: flex; align-items: center; gap: 8px; }
        .deadline-list { display: flex; flex-direction: column; gap: 10px; }
        .deadline-item { background: rgba(255, 118, 117, 0.1); padding: 12px; border-radius: 12px; border-left: 4px solid var(--danger); }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .weekday { text-align: center; font-size: 11px; color: var(--text-light); }
        .day-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; position: relative; font-size: 14px; }
        .day-cell:hover { background: rgba(108, 92, 231, 0.1); }
        .day-cell.today { color: var(--primary); font-weight: bold; }
        .day-cell.selected { background: var(--primary); color: white; transform: scale(1.05); box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3); }
        .dot { width: 4px; height: 4px; background: var(--success); border-radius: 50%; position: absolute; bottom: 5px; display: none; }
        .day-cell.has-task .dot { display: block; }
        .day-cell.selected .dot { background: white; }
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        .date-header-card { background: var(--card-bg); padding: 25px 35px; border-radius: 24px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; }
        .header-info h2 { margin: 0; font-size: 32px; color: var(--primary); font-weight: 800; letter-spacing: -1px; }
        .header-info .full-date { font-size: 16px; margin-top: 5px; color: var(--text-light); font-weight: 600; }
        .progress-ring-container { position: relative; width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(var(--success) 0deg, var(--ring-bg) 0deg); display: flex; align-items: center; justify-content: center; transition: background 0.5s ease; }
        .progress-ring-inner { width: 85%; height: 85%; background: var(--card-bg); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; }
        .percentage { font-weight: 800; font-size: 24px; color: var(--text-main); line-height: 1; }
        .task-label { font-size: 13px; font-weight: 600; color: var(--text-light); margin-top: 2px; }
        .input-group { background: var(--card-bg); padding: 10px; border-radius: 20px; box-shadow: var(--shadow); display: flex; gap: 15px; align-items: center; border: 1px solid rgba(0,0,0,0.05); }
        .clean-input { border: none; background: transparent; outline: none; font-family: inherit; color: var(--text-main); font-size: 18px; font-weight: 600; padding: 15px; flex: 2; }
        .time-wrapper { background: var(--input-bg); padding: 10px 15px; border-radius: 12px; display: flex; align-items: center; gap: 8px; }
        .time-input { border: none; background: transparent; font-family: inherit; font-weight: bold; font-size: 16px; color: var(--primary); cursor: pointer; outline: none; }
        .priority-select { border: none; outline: none; background: transparent; font-size: 14px; color: var(--text-light); font-weight: 600; cursor: pointer; padding: 10px; }
        .add-btn { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; padding: 15px 35px; border-radius: 15px; cursor: pointer; font-weight: 700; font-size: 16px; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3); }
        .task-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 15px; }
        .task-item { background: var(--card-bg); padding: 20px 25px; border-radius: 18px; display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: transform 0.2s; border: 1px solid rgba(0,0,0,0.02); }
        .check-circle { min-width: 28px; height: 28px; border: 3px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
        .task-item.completed .check-circle { background: var(--primary); }
        .task-item.completed .check-circle::after { content: '✓'; color: white; font-size: 16px; font-weight: bold; }
        .task-time-badge { background: rgba(108, 92, 231, 0.1); color: var(--primary); font-weight: 700; font-size: 15px; padding: 8px 14px; border-radius: 10px; font-family: monospace; white-space: nowrap; }
        .task-content { flex: 1; font-size: 18px; font-weight: 600; }
        .task-item.completed .task-content { text-decoration: line-through; opacity: 0.5; }
        .action-btn { border: none; background: transparent; cursor: pointer; font-size: 18px; padding: 10px; opacity: 0.6; }
        .deadline-timer, .deadline-title { display:block; }
        @media (max-width: 850px) { .app-container { grid-template-columns: 1fr; } .sidebar { flex-direction: row; flex-wrap: wrap; } .card-box { flex: 1; min-width: 280px; } .input-group { flex-direction: column; padding: 20px; } .task-item { flex-wrap: wrap; } .task-time-badge { order: -1; font-size: 12px; } .date-header-card { flex-direction: column; text-align: center; gap: 20px; } }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
    <div class="login-card">
        <h1 style="color:var(--primary); margin-bottom:10px">Study Planner Online</h1>
        <p style="color:var(--text-light)">Đăng nhập để đồng bộ dữ liệu của bạn trên mọi thiết bị.</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <i class="fa-brands fa-google"></i> Tiếp tục với Google
        </button>
    </div>
</div>

<!-- MAIN APP (Ẩn cho đến khi đăng nhập) -->
<div id="app-content">
    <div class="app-container">
        <div class="sidebar">
            <div class="card-box" style="text-align:center">
                <div style="display:flex; justify-content:flex-end">
                    <button onclick="logout()" style="border:none; background:transparent; color:var(--danger); cursor:pointer; font-size:12px">Đăng xuất <i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
                <div class="level-badge" id="level-display">1</div>
                <h4 style="margin:5px 0">Level <span id="lvl-text">1</span></h4>
                <div class="xp-bar-container"><div class="xp-fill" id="xp-bar"></div></div>
                <div style="font-size:12px; opacity:0.7"><span id="xp-text">0/100</span> XP</div>
            </div>
            <div class="card-box deadline-card">
                <h3><i class="fa-solid fa-bell"></i> Sắp đến hạn</h3>
                <div class="deadline-list" id="deadline-container"></div>
            </div>
            <div class="card-box">
                <div class="cal-header">
                    <span id="cal-month-year">...</span>
                    <div>
                        <i class="fa-solid fa-chevron-left" style="cursor:pointer; padding:5px" onclick="changeMonth(-1)"></i>
                        <i class="fa-solid fa-chevron-right" style="cursor:pointer; padding:5px" onclick="changeMonth(1)"></i>
                    </div>
                </div>
                <div class="cal-grid" id="calendar-grid"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="date-header-card">
                <div class="header-info">
                    <h2 id="display-weekday">Thứ ...</h2>
                    <div class="full-date" id="display-full-date">.../.../....</div>
                </div>
                <div class="header-right" style="display:flex; align-items:center; gap:20px">
                    <div class="progress-ring-container" id="progress-ring-css">
                        <div class="progress-ring-inner">
                            <div class="percentage" id="percent-text">0%</div>
                            <div class="task-label" id="task-count-label">0/0</div>
                        </div>
                    </div>
                    <button onclick="toggleTheme()" style="background:rgba(0,0,0,0.05); border:none; width:45px; height:45px; border-radius:12px; cursor:pointer; color:var(--text-main); font-size:18px"><i class="fa-solid fa-moon"></i></button>
                </div>
            </div>

            <div class="input-group">
                <input type="text" id="task-input" class="clean-input" placeholder="Nhập kế hoạch mới...">
                <div class="time-wrapper">
                    <i class="fa-regular fa-clock" style="color:var(--text-light)"></i>
                    <input type="time" id="time-input" class="time-input">
                </div>
                <select id="priority-select" class="priority-select">
                    <option value="normal">Thường</option>
                    <option value="high">❗️ Gấp</option>
                </select>
                <button class="add-btn" onclick="addTask()">Thêm</button>
            </div>

            <ul class="task-list" id="task-list"></ul>
            <div id="empty-msg" style="text-align:center; padding:30px; opacity:0.5; display:none; font-size:16px;">Hôm nay trống lịch.</div>
        </div>
    </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
    // --- BẮT ĐẦU: CẤU HÌNH FIREBASE ---
    // 1. Dán Config bạn vừa copy ở Bước 4 vào giữa cặp ngoặc nhọn bên dưới
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- DÁN CONFIG CỦA BẠN VÀO ĐÂY (THAY THẾ ĐOẠN NÀY) ---
    const firebaseConfig = {
        apiKey: "AIzaSyCKHrQpOGfCU8dri2vxjqJ4CPxBJ0YZMZg",
  authDomain: "planhd.firebaseapp.com",
  projectId: "planhd",
  storageBucket: "planhd.firebasestorage.app",
  messagingSenderId: "917364779636",
  appId: "1:917364779636:web:fe3a06af62606932f7ff21",
  measurementId: "G-J3757X7ZX6"
    };
    // -------------------------------------------------------

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let data = { tasks: [], user: { level: 1, xp: 0, streak: 0, lastDate: null } };
    
    // --- LOGIN LOGIC ---
    window.loginWithGoogle = () => {
        signInWithPopup(auth, provider).catch((error) => alert(error.message));
    }
    
    window.logout = () => {
        signOut(auth).then(() => location.reload());
    }

    // THEO DÕI TRẠNG THÁI ĐĂNG NHẬP
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            
            // Lắng nghe dữ liệu từ Cloud Firestore (Realtime)
            const userRef = doc(db, "users", user.uid);
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    data = docSnap.data();
                } else {
                    // Nếu user mới chưa có data, tạo data mặc định
                    saveToCloud(); 
                }
                // Render lại giao diện khi có data mới về
                renderAll();
            });
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
        }
    });

    // HÀM LƯU DỮ LIỆU LÊN CLOUD
    function saveToCloud() {
        if(currentUser) {
            setDoc(doc(db, "users", currentUser.uid), data);
        }
    }

    // --- APP LOGIC (GIỐNG V12 NHƯNG DÙNG saveToCloud thay vì localStorage) ---
    let curDate = new Date();
    let selDate = new Date().toISOString().slice(0,10);
    const dayNames = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    
    // Init Time
    function setNowTime() {
        const now = new Date();
        const h = now.getHours().toString().padStart(2,'0');
        const m = now.getMinutes().toString().padStart(2,'0');
        document.getElementById('time-input').value = `${h}:${m}`;
    }
    setNowTime();

    // Các hàm xử lý UI
    function renderAll() {
        renderCalendar();
        renderList();
        updateUserUI();
        updateGlobalDeadlines();
    }

    window.changeMonth = (n) => { curDate.setMonth(curDate.getMonth()+n); renderCalendar(); }
    window.selectDate = (str) => {
        selDate = str;
        const [y, m, d] = str.split('-');
        const dateObj = new Date(y, m-1, d);
        document.getElementById('display-weekday').innerText = dayNames[dateObj.getDay()];
        document.getElementById('display-full-date').innerText = `${d}/${m}/${y}`;
        renderCalendar();
        renderList();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        const m = curDate.getMonth(), y = curDate.getFullYear();
        document.getElementById('cal-month-year').innerText = `Tháng ${m+1}/${y}`;
        const firstDay = new Date(y, m, 1).getDay();
        const days = new Date(y, m+1, 0).getDate();
        for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));
        for(let i=1; i<=days; i++) {
            const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            const hasTask = data.tasks.some(t => t.date === dateStr && !t.completed);
            const cell = document.createElement('div');
            cell.className = `day-cell ${dateStr === new Date().toISOString().slice(0,10)?'today':''} ${hasTask?'has-task':''}`;
            if(dateStr === selDate) cell.classList.add('selected');
            cell.innerHTML = `${i}<div class="dot"></div>`;
            cell.onclick = () => window.selectDate(dateStr);
            grid.appendChild(cell);
        }
    }

    window.addTask = () => {
        const txt = document.getElementById('task-input').value.trim();
        const time = document.getElementById('time-input').value;
        if(!txt) return;
        data.tasks.push({ id: Date.now(), title: txt, date: selDate, time: time, completed: false, priority: document.getElementById('priority-select').value });
        document.getElementById('task-input').value = '';
        setNowTime();
        saveToCloud();
    }

    function renderList() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        const dayTasks = data.tasks.filter(t => t.date === selDate);
        dayTasks.sort((a, b) => (a.time || '23:59').localeCompare(b.time || '23:59'));

        const total = dayTasks.length;
        const done = dayTasks.filter(t => t.completed).length;
        const pct = total === 0 ? 0 : Math.round((done/total)*100);
        
        document.getElementById('percent-text').innerText = `${pct}%`;
        document.getElementById('task-count-label').innerText = `${done}/${total}`;
        
        const deg = (pct / 100) * 360;
        document.getElementById('progress-ring-css').style.background = `conic-gradient(var(--success) ${deg}deg, var(--ring-bg) ${deg}deg)`;

        if(dayTasks.length === 0) {
            document.getElementById('empty-msg').style.display = 'block';
        } else {
            document.getElementById('empty-msg').style.display = 'none';
            dayTasks.forEach(t => {
                const li = document.createElement('li');
                li.className = `task-item ${t.completed?'completed':''}`;
                if(t.priority === 'high') li.style.borderLeft = "5px solid #ff7675";
                const timeDisplay = t.time ? `<div class="task-time-badge">${t.time}</div>` : '';
                li.innerHTML = `
                    <div class="check-circle" onclick="toggleTask(${t.id})"></div>
                    ${timeDisplay}
                    <span class="task-content">${t.title}</span>
                    <button class="action-btn" onclick="moveToTmr(${t.id})" style="color:#74b9ff"><i class="fa-solid fa-share"></i></button>
                    <button class="action-btn" onclick="delTask(${t.id})" style="color:#ff7675"><i class="fa-solid fa-trash"></i></button>
                `;
                list.appendChild(li);
            });
        }
    }

    window.toggleTask = (id) => {
        const t = data.tasks.find(x => x.id === id);
        if(t) {
            t.completed = !t.completed;
            if(t.completed) { addXP(15); confetti({particleCount: 40, origin: {y: 0.6}}); }
            saveToCloud();
        }
    }

    window.delTask = (id) => { if(confirm("Xóa nhé?")) { data.tasks = data.tasks.filter(x => x.id !== id); saveToCloud(); } }
    window.moveToTmr = (id) => {
        const t = data.tasks.find(x => x.id === id);
        if(t) {
            const d = new Date(t.date); d.setDate(d.getDate()+1);
            t.date = d.toISOString().slice(0,10);
            saveToCloud();
        }
    }

    function updateGlobalDeadlines() {
        const container = document.getElementById('deadline-container');
        const now = new Date();
        const upcoming = data.tasks.filter(t => !t.completed).map(t => {
            const timeStr = t.time ? t.time : '23:59';
            return { ...t, fullDate: new Date(`${t.date}T${timeStr}`) };
        }).filter(t => t.fullDate > now).sort((a, b) => a.fullDate - b.fullDate).slice(0, 2);

        if(upcoming.length === 0) {
            container.innerHTML = `<div style="font-size:12px; opacity:0.6; text-align:center">Chill thôi! ☕</div>`;
            return;
        }
        container.innerHTML = upcoming.map(t => {
            const diff = t.fullDate - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            return `<div class="deadline-item ${h<24?'urgent':''}"><span class="deadline-title">${t.title}</span><span class="deadline-timer"><i class="fa-regular fa-clock"></i> ${h}h ${m}m</span></div>`;
        }).join('');
    }

    function addXP(n) {
        data.user.xp += n;
        if(data.user.xp >= data.user.level*100) { data.user.level++; data.user.xp = 0; alert("Level Up! " + data.user.level); }
        saveToCloud();
    }
    function updateUserUI() {
        document.getElementById('level-display').innerText = data.user.level;
        document.getElementById('lvl-text').innerText = data.user.level;
        document.getElementById('xp-text').innerText = `${data.user.xp}/${data.user.level*100}`;
        document.getElementById('xp-bar').style.width = `${(data.user.xp/(data.user.level*100))*100}%`;
    }
    
    window.toggleTheme = () => { document.body.classList.toggle('dark-mode'); localStorage.setItem('theme', document.body.classList.contains('dark-mode')?'dark':'light'); }
    if(localStorage.getItem('theme')==='dark') document.body.classList.add('dark-mode');
    
    // Init Calendar Text
    selectDate(selDate);

</script>

</body>
</html>
